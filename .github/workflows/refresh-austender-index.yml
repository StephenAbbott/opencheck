name: Refresh AusTender supplier index

# Rebuilds the AusTender supplier index from the Open Contracting
# Partnership's Data Registry copy of AusTender's contract notices
# (publication 19, full.jsonl.gz, ~260 MB, retrieved by the registry monthly)
# and replaces the `austender-index` release asset the backend downloads at
# boot (AUSTENDER_DB_URL).
#
# Why here and not on Render: reading the file is about a minute of
# CPU-bound Python that would hold the GIL against live lookups. The result is
# ~32 MB (~15 MB gzipped).
#
# Weekly rather than monthly so a registry retrieval lands within a week; the
# build is a full rebuild either way.
on:
  schedule:
    - cron: "30 5 * * 2" # 05:30 UTC on Tuesdays
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: refresh-austender-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # required to create/upload the release asset
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # uploads use GH_TOKEN; nothing pushes

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build the index from the registry's full file
        working-directory: backend
        run: |
          uv sync
          uv run python scripts/build_austender_index.py \
            --out "$RUNNER_TEMP/austender.sqlite" --gzip

      - name: Sanity-check the output (guard against a broken or partial file)
        run: |
          python3 - <<'PY'
          import os, sqlite3, sys
          path = os.path.join(os.environ["RUNNER_TEMP"], "austender.sqlite")
          conn = sqlite3.connect(path)
          meta = dict(conn.execute("SELECT key, value FROM meta"))
          n = conn.execute("SELECT COUNT(*) FROM supplier").fetchone()[0]
          print(f"{n} supplier ABNs from {meta.get('releases')} notices, latest {meta.get('data_to')}")
          if n < 40000:
              sys.exit(f"Refusing to publish: only {n} suppliers — likely a source/format change.")
          PY

      - name: Replace the `austender-index` release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gh release view austender-index >/dev/null 2>&1 || gh release create austender-index \
            --title "AusTender supplier index" \
            --notes "Built by refresh-austender-index.yml from AusTender contract notice data (© Commonwealth of Australia, Department of Finance, CC BY 3.0 AU) via the Open Contracting Partnership's Data Registry. Downloaded by the backend at boot (AUSTENDER_DB_URL)."
          bash backend/scripts/replace_release_asset.sh austender-index \
            "$RUNNER_TEMP/austender.sqlite.gz" austender.sqlite.gz
