name: Tests

# Gates every push and PR on the deterministic test suites. The live-API smoke
# tier runs separately (live-smoke.yml, weekly) so a transient upstream blip can
# never block a merge; the drift checks live in vendored-enum-drift.yml.
#
# Runs once per change (Phase 266): on a pull request, and on a push to main
# (the merge). Before, every push to a PR branch ran the whole workflow twice —
# once for ``push`` and once for ``pull_request``. A newer push to the same PR
# cancels the run it supersedes. Actions are pinned to commit SHAs (the tag in
# the comment is what the SHA was when pinned); Dependabot proposes updates.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    # The suite takes ~2 minutes and is offline (tests/_network_guard.py); a
    # run past this is hung, not slow.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: System deps for the ftm extra (bods-ftm → followthemoney → pyicu)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ libicu-dev pkg-config
      - name: Install backend (with test deps + ftm extra)
        run: uv sync --extra ftm
        working-directory: backend
      - name: Backend test suite
        # Live tests are @pytest.mark.live and skipped unless --run-live, so this
        # is fully offline/deterministic.
        run: uv run pytest -q
        working-directory: backend
      - name: Type check (mypy ratchet)
        # Non-strict mypy; a module may not carry more errors than
        # backend/mypy-baseline.json records (Phase 266).
        if: ${{ !cancelled() }}
        run: uv run python scripts/mypy_ratchet.py
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Type-check + build
        run: npm run build
        working-directory: frontend
      - name: Unit tests
        run: npm test
        working-directory: frontend
      - name: Design-system lint
        # Ratchet, not a ban: a file may never carry MORE raw hex or more
        # text-[NNpx] than its baseline records, and a new file may carry none.
        # Same pattern as the OKF drift job — the check fails on regression, and
        # equally on a stale baseline after an improvement, so a migration
        # commit has to lock its own gain in. See
        # frontend/scripts/lint-design-system.mjs for why it is not a hard ban.
        run: npm run lint:design
        working-directory: frontend

  e2e:
    # The smoke tier: a real backend and a production build of the SPA, driven
    # in Chromium. It exists for the failures the other two tiers cannot see —
    # a page that renders two of something, or does not fit its viewport.
    # Offline by construction: no API keys are set, so every adapter serves its
    # stub or the committed Open Ownership bulk BODS data, which is what the
    # curated homepage examples use anyway. Nothing here can fail because an
    # upstream register had a bad morning.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: System deps for the ftm extra (bods-ftm → followthemoney → pyicu)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ libicu-dev pkg-config
      - name: Install backend
        run: uv sync --extra ftm
        working-directory: backend
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Install Chromium
        # Only the one browser, and only here: the unit job has no use for it.
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Smoke
        # playwright.config.ts starts uvicorn and `vite build && vite preview`
        # itself, so there is nothing to orchestrate here.
        run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
