name: Refresh MTender supplier index

# Rebuilds the MTender (Moldovan public procurement) supplier index from the
# Open Contracting Partnership's Data Registry copy of MTender's OCDS data
# (publication 34, full.jsonl.gz, ~110 MB, retrieved by the registry monthly)
# and replaces the `mtender-index` release asset the backend downloads at
# boot (MTENDER_DB_URL).
#
# Why here and not on Render: reading the file is CPU-bound Python that would
# hold the GIL against live lookups. The result is ~4 MB (~1.4 MB gzipped).
#
# Weekly rather than monthly so a registry retrieval lands within a week; the
# build is a full rebuild either way.
on:
  schedule:
    - cron: "45 5 * * 2" # 05:45 UTC on Tuesdays
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: refresh-mtender-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # required to create/upload the release asset
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # uploads use GH_TOKEN; nothing pushes

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build the index from the registry's full file
        working-directory: backend
        run: |
          uv sync
          uv run python scripts/build_mtender_index.py \
            --out "$RUNNER_TEMP/mtender_moldova.sqlite" --gzip

      - name: Sanity-check the output (guard against a broken or partial file)
        run: |
          python3 - <<'PY'
          import os, sqlite3, sys
          path = os.path.join(os.environ["RUNNER_TEMP"], "mtender_moldova.sqlite")
          conn = sqlite3.connect(path)
          meta = dict(conn.execute("SELECT key, value FROM meta"))
          n = conn.execute("SELECT COUNT(*) FROM supplier").fetchone()[0]
          print(f"{n} supplier IDNOs from {meta.get('awards_kept')} awards, {meta.get('data_from')} to {meta.get('data_to')}")
          if n < 6000:
              sys.exit(f"Refusing to publish: only {n} suppliers — likely a source/format change.")
          PY

      - name: Replace the `mtender-index` release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gh release view mtender-index >/dev/null 2>&1 || gh release create mtender-index \
            --title "MTender supplier index" \
            --notes "Built by refresh-mtender-index.yml from MTender public procurement data published by the Ministry of Finance of the Republic of Moldova (no licence named; verify before commercial re-use), via the Open Contracting Partnership's Data Registry. Downloaded by the backend at boot (MTENDER_DB_URL)."
          bash backend/scripts/replace_release_asset.sh mtender-index \
            "$RUNNER_TEMP/mtender_moldova.sqlite.gz" mtender_moldova.sqlite.gz
