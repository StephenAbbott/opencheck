name: Refresh Compras.gov.br supplier index

# Rebuilds the Compras.gov.br supplier index from the Open Contracting
# Partnership's Data Registry copy of Brazil's Compras.gov.br OCDS data
# (publication 157, full.jsonl.gz, ~960 MB, retrieved by the registry
# monthly) and replaces the `compras-gov-br-index` release asset the backend
# downloads at boot (COMPRAS_GOV_BR_DB_URL).
#
# Why here and not on Render: reading 1.7M awards is several minutes of
# CPU-bound Python that would hold the GIL against live lookups, and the
# download alone is about a gigabyte.
#
# Weekly rather than monthly so a registry retrieval lands within a week; the
# build is a full rebuild either way.
on:
  schedule:
    - cron: "30 5 * * 3" # 05:30 UTC on Wednesdays
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: refresh-compras-gov-br-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write # required to create/upload the release asset
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # uploads use GH_TOKEN; nothing pushes

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build the index from the registry's full file
        working-directory: backend
        run: |
          uv sync
          uv run python scripts/build_compras_gov_br_index.py \
            --out "$RUNNER_TEMP/compras_gov_br.sqlite" --gzip

      - name: Sanity-check the output (guard against a broken or partial file)
        run: |
          python3 - <<'PY'
          import os, sqlite3, sys
          path = os.path.join(os.environ["RUNNER_TEMP"], "compras_gov_br.sqlite")
          conn = sqlite3.connect(path)
          meta = dict(conn.execute("SELECT key, value FROM meta"))
          n = conn.execute("SELECT COUNT(*) FROM supplier").fetchone()[0]
          print(f"{n} supplier CNPJ roots from {meta.get('releases')} processes, latest {meta.get('data_to')}")
          if n < 150000:
              sys.exit(f"Refusing to publish: only {n} suppliers — likely a source/format change.")
          PY

      - name: Replace the `compras-gov-br-index` release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gh release view compras-gov-br-index >/dev/null 2>&1 || gh release create compras-gov-br-index \
            --title "Compras.gov.br supplier index" \
            --notes "Built by refresh-compras-gov-br-index.yml from Compras.gov.br public procurement data (Secretaria de Gestão e Inovação, CC BY 4.0) via the Open Contracting Partnership's Data Registry. Holds no supplier names or CPFs. Downloaded by the backend at boot (COMPRAS_GOV_BR_DB_URL)."
          bash backend/scripts/replace_release_asset.sh compras-gov-br-index \
            "$RUNNER_TEMP/compras_gov_br.sqlite.gz" compras_gov_br.sqlite.gz
